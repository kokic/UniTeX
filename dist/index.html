<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://codemirror.net/codemirror.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.1/dist/katex.min.css">
  <link rel="stylesheet" href="./css/site.css">
  <title>UniTeX 2</title>
</head>

<body>
  <header class="page-header">
    <h1 class="wordmark">UniTeX <span>2</span></h1>
  </header>

  <nav class="pane-switch" aria-label="Workspace">
    <button class="button" type="button" data-pane="edit" aria-controls="source-pane" aria-pressed="true">Edit</button>
    <button class="button" type="button" data-pane="result" aria-controls="result-pane" aria-pressed="false">Result</button>
  </nav>

  <main class="workbench" data-active-pane="edit">
    <section id="source-pane" class="pane source-pane" aria-labelledby="source-title">
      <header class="pane-toolbar">
        <h2 id="source-title" class="pane-title">Markdown</h2>
        <button id="clear-source" class="button" type="button">Clear</button>
      </header>
      <div id="source" class="pane-body editor"></div>
    </section>

    <section id="result-pane" class="pane result-pane" aria-label="Result">
      <header class="pane-toolbar">
        <select id="result-view" class="form-select" aria-label="Result view">
          <optgroup label="Export">
            <option value="unicode">Unicode</option>
            <option value="typst">Typst</option>
          </optgroup>
          <optgroup label="Preview">
            <option value="html">KaTeX</option>
            <option value="mathml">MathML</option>
          </optgroup>
        </select>
        <div class="pane-actions">
          <button id="copy-result" class="button button-primary" type="button" aria-live="polite">Copy</button>
          <details id="result-options" class="result-options">
            <summary class="button menu-toggle" aria-label="Result options">⋯</summary>
            <div class="option-menu">
              <button class="button menu-action" type="button" data-copy="trim">Copy trimmed</button>
              <button class="button menu-action" type="button" data-copy="single-line">Copy as one line</button>
            </div>
          </details>
        </div>
      </header>
      <div id="result" class="pane-body result"></div>
    </section>
  </main>

  <footer class="page-footer">
    <span>Created by <a href="https://github.com/kokic" target="_blank">kokic</a></span>
    <span><a href="https://github.com/kokic/UniTeX/blob/main/LICENSE" target="_blank">MIT License</a></span>
    <span><a href="https://github.com/kokic/UniTeX" target="_blank">GitHub</a></span>
    <span><a href="https://github.com/kokic/UniTeX/issues/new" target="_blank">Issues</a></span>
  </footer>

  <script type="module" src="./workbench.js"></script>
</body>

</html>
